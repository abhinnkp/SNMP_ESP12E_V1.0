; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
lib_ignore = lwIP_enc28j60, UIPEthernet
; EthernetENC 2.0.4 is vendored under lib/EthernetENC so this firmware can be
; rebuilt without Internet access.
monitor_speed = 9600
; Conservative flashing settings for bare/clone ESP-12E boards. These reduce
; flash-write failures such as "Failed to write compressed data to flash".
; The ESP UART is shared with the RS-485 interface on this hardware.  Use a
; very conservative bootloader speed to tolerate USB/serial noise while
; flashing.  Disconnect the RS-485 module during upload for best results.
upload_speed = 115200
board_build.flash_mode = dout
board_build.variant = nodemcu

[env:esp12e_nodemcu_115200]
upload_resetmethod = nodemcu
upload_speed = 115200

[env:esp12e_ck_115200]
upload_resetmethod = ck
upload_speed = 115200

[env:esp12e_nodemcu_57600]
upload_resetmethod = nodemcu
upload_speed = 57600

[env:esp12e_ck_57600]
upload_resetmethod = ck
upload_speed = 57600
